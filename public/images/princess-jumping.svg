<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- 公主跳跃姿态 -->
  
  <!-- 皇冠 -->
  <rect x="8" y="2" width="24" height="3" fill="#FFD700"/>
  <rect x="6" y="5" width="28" height="2" fill="#FFD700"/>
  <rect x="10" y="0" width="2" height="4" fill="#FFD700"/>
  <rect x="18" y="0" width="4" height="4" fill="#FFD700"/>
  <rect x="28" y="0" width="2" height="4" fill="#FFD700"/>
  
  <!-- 宝石装饰 -->
  <rect x="17" y="3" width="6" height="2" fill="#FF69B4"/>
  
  <!-- 脸部 -->
  <rect x="8" y="7" width="24" height="2" fill="#FFDBAC"/>
  <rect x="6" y="9" width="28" height="8" fill="#FFDBAC"/>
  
  <!-- 头发飘动 -->
  <rect x="4" y="7" width="4" height="6" fill="#DDA0DD"/>
  <rect x="32" y="7" width="4" height="6" fill="#DDA0DD"/>
  <rect x="2" y="13" width="36" height="4" fill="#DDA0DD"/>
  
  <!-- 眼睛 -->
  <rect x="12" y="11" width="2" height="2" fill="black"/>
  <rect x="26" y="11" width="2" height="2" fill="black"/>
  
  <!-- 眼睫毛 -->
  <rect x="11" y="10" width="1" height="1" fill="black"/>
  <rect x="14" y="10" width="1" height="1" fill="black"/>
  <rect x="25" y="10" width="1" height="1" fill="black"/>
  <rect x="28" y="10" width="1" height="1" fill="black"/>
  
  <!-- 嘴巴 -->
  <rect x="18" y="15" width="4" height="1" fill="#FF69B4"/>
  
  <!-- 身体 - 粉色连衣裙上部 -->
  <rect x="10" y="17" width="20" height="10" fill="#FF69B4"/>
  
  <!-- 连衣裙装饰 -->
  <rect x="12" y="19" width="16" height="2" fill="#FFB6C1"/>
  <rect x="16" y="23" width="8" height="2" fill="#FFB6C1"/>
  
  <!-- 手臂 - 跳跃时动态姿态 -->
  <!-- 左臂向上 -->
  <g transform="rotate(-45 8 23)">
    <rect x="4" y="19" width="6" height="4" fill="#FFDBAC"/>
  </g>
  <!-- 右臂向上 -->
  <g transform="rotate(45 32 23)">
    <rect x="30" y="19" width="6" height="4" fill="#FFDBAC"/>
  </g>
  
  <!-- 连衣裙下摆 - 跳跃时飘扬 -->
  <rect x="8" y="27" width="24" height="8" fill="#FF69B4"/>
  <rect x="4" y="35" width="32" height="4" fill="#FF69B4"/>
  
  <!-- 裙摆装饰 -->
  <rect x="10" y="29" width="20" height="2" fill="#FFB6C1"/>
  <rect x="6" y="37" width="28" height="2" fill="#FFB6C1"/>
  
  <!-- 腿部 - 跳跃时弯曲 -->
  <!-- 左腿弯曲 -->
  <g transform="rotate(20 15 39)">
    <rect x="13" y="37" width="3" height="5" fill="#FFDBAC"/>
  </g>
  <!-- 右腿弯曲 -->
  <g transform="rotate(-20 25 39)">
    <rect x="23" y="37" width="3" height="5" fill="#FFDBAC"/>
  </g>
  
  <!-- 鞋子 - 跳跃时位置 -->
  <g transform="rotate(15 15 45)">
    <rect x="11" y="43" width="7" height="4" fill="#FF1493"/>
  </g>
  <g transform="rotate(-15 25 45)">
    <rect x="21" y="43" width="7" height="4" fill="#FF1493"/>
  </g>
</svg>
