<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg" style="image-rendering: pixelated;">
  <!-- 马里奥站立姿态 - 基于左图像素级还原 -->
  
  <!-- 帽子 -->
  <rect x="8" y="2" width="24" height="2" fill="#E60012"/>
  <rect x="6" y="4" width="28" height="2" fill="#E60012"/>
  <rect x="4" y="6" width="32" height="6" fill="#E60012"/>
  
  <!-- 帽子M标志 -->
  <rect x="15" y="7" width="2" height="4" fill="white"/>
  <rect x="17" y="8" width="2" height="2" fill="white"/>
  <rect x="21" y="7" width="2" height="4" fill="white"/>
  
  <!-- 脸部 -->
  <rect x="8" y="12" width="24" height="2" fill="#FFDBAC"/>
  <rect x="6" y="14" width="28" height="8" fill="#FFDBAC"/>
  
  <!-- 头发侧鬓 -->
  <rect x="4" y="12" width="4" height="4" fill="#8B4513"/>
  <rect x="32" y="12" width="4" height="4" fill="#8B4513"/>
  
  <!-- 眼睛 -->
  <rect x="12" y="16" width="2" height="2" fill="black"/>
  <rect x="24" y="16" width="2" height="2" fill="black"/>
  
  <!-- 鼻子 -->
  <rect x="18" y="18" width="4" height="2" fill="#FFDBAC" stroke="#D4A574" stroke-width="0.5"/>
  
  <!-- 胡子 -->
  <rect x="14" y="20" width="12" height="2" fill="#8B4513"/>
  
  <!-- 身体 - 红色衬衫 -->
  <rect x="10" y="22" width="20" height="12" fill="#E60012"/>
  
  <!-- 蓝色背带裤 -->
  <rect x="8" y="34" width="24" height="8" fill="#0066CC"/>
  
  <!-- 背带 -->
  <rect x="14" y="24" width="2" height="10" fill="#0066CC"/>
  <rect x="24" y="24" width="2" height="10" fill="#0066CC"/>
  
  <!-- 金色纽扣 -->
  <rect x="18" y="28" width="4" height="2" fill="#FFD700"/>
  
  <!-- 手臂 - 站立时自然下垂 -->
  <rect x="6" y="26" width="4" height="6" fill="#FFDBAC"/>
  <rect x="30" y="26" width="4" height="6" fill="#FFDBAC"/>
  
  <!-- 腿部 - 站立 -->
  <rect x="14" y="42" width="4" height="8" fill="#0066CC"/>
  <rect x="22" y="42" width="4" height="8" fill="#0066CC"/>
  
  <!-- 鞋子 -->
  <rect x="12" y="50" width="8" height="4" fill="#8B4513"/>
  <rect x="20" y="50" width="8" height="4" fill="#8B4513"/>
</svg>
